name: Stop an Alibaba Cloud spot runner
description: Destroy the machine the start action bought and remove its runner registration.
inputs:
  access-key-id:
    description: AccessKey ID of the RAM user.
    required: true
  access-key-secret:
    description: AccessKey secret of the RAM user.
    required: true
  github-token:
    description: The same GitHub token the start action used.
    required: true
  instance-id:
    description: The start action's instance-id output.
    required: true
  label:
    description: The start action's label output.
    required: true
  region:
    description: Alibaba Cloud region.
    default: ap-southeast-5
runs:
  using: composite
  steps:
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/../../aliyun-runner.mjs" stop
      env:
        ALIYUN_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        ALIYUN_ACCESS_KEY_SECRET: ${{ inputs.access-key-secret }}
        RUNNER_GITHUB_TOKEN: ${{ inputs.github-token }}
        INSTANCE_ID: ${{ inputs.instance-id }}
        RUNNER_LABEL: ${{ inputs.label }}
        ALIYUN_REGION: ${{ inputs.region }}
